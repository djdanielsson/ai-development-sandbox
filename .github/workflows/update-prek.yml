---
name: "Update prek Version"

on:
  schedule:
    - cron: "20 6 * * 1" # Monday 06:20 UTC
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write
  actions: write

jobs:
  update-prek:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v6

      - name: Check for new prek release
        id: check
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          latest_tag=$(gh api repos/j178/prek/releases/latest --jq '.tag_name')
          tools_file="omnigent/scripts/install-omnigent-agent-tools.sh"
          current_tag=$(grep -oP 'PREK_VERSION="\K[^"]+' "$tools_file")

          echo "latest=$latest_tag" >> "$GITHUB_OUTPUT"
          echo "current=$current_tag" >> "$GITHUB_OUTPUT"

          if [ "$latest_tag" = "$current_tag" ]; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "prek is already up to date ($current_tag)."
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
            echo "prek update: $current_tag → $latest_tag"
            sed -i "s|PREK_VERSION=\"${current_tag}\"|PREK_VERSION=\"${latest_tag}\"|" "$tools_file"
          fi

      - name: Create pull request
        id: pr
        if: steps.check.outputs.changed == 'true'
        uses: peter-evans/create-pull-request@3ffccacd46053766916f087ce41d627c0b8cf2d1 # v8
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          branch: auto/update-prek
          delete-branch: true
          title: "prek: update to ${{ steps.check.outputs.latest }}"
          body: |
            Automated update of the prek version pin in `omnigent/scripts/install-omnigent-agent-tools.sh`.

            ### Changes
            - **prek**: `${{ steps.check.outputs.current }}` → `${{ steps.check.outputs.latest }}`
            - [Release notes](https://github.com/j178/prek/releases/tag/${{ steps.check.outputs.latest }})

            ---
            *Generated by the [update-prek](${{ github.server_url }}/${{ github.repository }}/actions/workflows/update-prek.yml) workflow.*
          labels: dependencies,prek
          commit-message: "prek: update to ${{ steps.check.outputs.latest }}"

      # GITHUB_TOKEN PRs do not reliably start unattended pull_request runs.
      # Dispatch both gates explicitly, using only the known update branch.
      - name: Run checks on update branch
        if: steps.pr.outputs.pull-request-number && steps.pr.outputs.pull-request-operation != 'closed'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
        run: |
          branch=$(gh pr view "${{ steps.pr.outputs.pull-request-number }}" --json headRefName --jq .headRefName)
          gh workflow run ci.yml --ref "$branch"
          gh workflow run sbom.yml --ref "$branch"
