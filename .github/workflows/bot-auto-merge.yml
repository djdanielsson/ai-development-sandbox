name: Bot auto-merge

on:
  workflow_run:
    workflows: [CI, "SBOM & Vulnerability Scan"]
    types: [completed]

permissions:
  contents: write
  pull-requests: write
  actions: read
  checks: read
  statuses: read

concurrency:
  group: bot-auto-merge-${{ github.event.workflow_run.head_branch }}
  cancel-in-progress: false

jobs:
  merge:
    name: Bot auto-merge
    if: github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout trusted default branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v6
        with:
          ref: ${{ github.event.repository.default_branch }}
          persist-credentials: false
      - name: Merge bot updates after successful checks
        uses: actions/github-script@v8
        with:
          script: |
            const merge = require('./.github/scripts/auto-merge.js');
            await merge({github, context, core});
