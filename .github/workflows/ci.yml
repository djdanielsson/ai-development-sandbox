---
name: "CI"

on:
  workflow_dispatch:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  pre-commit:
    name: Pre-commit checks
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v6

      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.x"

      - name: Run pre-commit
        uses: pre-commit/action@2c7b3805fd2a0fd8c1884dcaebf91fc102a13ecd # v3.0.1

  shellcheck:
    name: ShellCheck
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v6

      - name: Run ShellCheck
        uses: ludeeus/action-shellcheck@00cae500b08a931fb5698e11e79bfbd38e612a38 # 2.0.0
        with:
          scandir: devcontainer/scripts
          additional_files: devcontainer/.zshrc devcontainer/aibox.zsh

  build:
    name: Container build (${{ matrix.platform }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        platform: [linux/amd64, linux/arm64]
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v6

      - name: Set up QEMU
        uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4

      - name: Build Containerfile
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7
        with:
          context: devcontainer
          file: devcontainer/Containerfile
          platforms: ${{ matrix.platform }}
          push: false
          tags: ai-sandbox:ci-test
          cache-from: type=gha,scope=${{ matrix.platform }}
          cache-to: type=gha,mode=max,scope=${{ matrix.platform }}

  integration:
    name: Local integration tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v6
      - name: Run bridge boundary tests
        run: python3 -m unittest discover -s omnigent/smolvm-bridge
      - name: Test bot merge gates
        run: node --test .github/scripts/auto-merge.test.js

  omnigent-build:
    name: Omnigent container build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v6
      - name: Create temporary CI certificate
        run: |
          mkdir -p omnigent/certs
          openssl req -x509 -newkey rsa:2048 -nodes -days 1 \
            -subj '/CN=CI test CA' -addext 'basicConstraints=critical,CA:TRUE' \
            -keyout "$RUNNER_TEMP/ci-ca.key" \
            -out omnigent/certs/redhat-internal-root-ca.crt
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4
      - name: Build Omnigent image
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7
        with:
          context: omnigent
          file: omnigent/Containerfile
          load: true
          tags: omnigent-local:ci-test
          cache-from: type=gha,scope=omnigent
          cache-to: type=gha,mode=max,scope=omnigent
      - name: Verify providers and policy import against upstream
        run: |
          docker run --rm --entrypoint python omnigent-local:ci-test -c \
            'import omnigent.community.sandbox.podman; import omnigent.community.sandbox.smolvm_bridge; import omnigent_same_subagent_model'
