name: Update Omnigent

on:
  schedule:
    - cron: "0 7 * * *" # Daily at 07:00 UTC
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write
  actions: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v6
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4
      - name: Resolve latest Omnigent image digest
        run: |
          digest=$(docker buildx imagetools inspect ghcr.io/omnigent-ai/omnigent-server:latest \
            --format '{{json .Manifest}}' | jq -er '.digest | select(test("^sha256:[a-f0-9]{64}$"))')
          sed -i "s|^FROM ghcr.io/omnigent-ai/omnigent-server:latest.*|FROM ghcr.io/omnigent-ai/omnigent-server:latest@${digest}|" omnigent/Containerfile
      - name: Create pull request
        id: pr
        uses: peter-evans/create-pull-request@15733dbdfeedb4f7fdb73d13c6f5ac83b710fab8 # v8
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          branch: auto/update-omnigent
          delete-branch: true
          title: "omnigent: update latest server image digest"
          body: |
            Update the pinned digest of `ghcr.io/omnigent-ai/omnigent-server:latest`.
            CI validates the image and local provider integration before merging.
            Pull the merged change and run `sh omnigent/scripts/omnigent-up.sh` to install it.
          labels: dependencies
          commit-message: "omnigent: update latest server image digest"

      # GITHUB_TOKEN PRs do not reliably start unattended pull_request runs.
      # Dispatch both gates explicitly, using only the known update branch.
      - name: Run checks on update branch
        if: steps.pr.outputs.pull-request-number && steps.pr.outputs.pull-request-operation != 'closed'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
        run: |
          branch=$(gh pr view "${{ steps.pr.outputs.pull-request-number }}" --json headRefName --jq .headRefName)
          gh workflow run ci.yml --ref "$branch"
          gh workflow run sbom.yml --ref "$branch"
