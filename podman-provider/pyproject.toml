[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "omnigent-podman-provider"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
  "omnigent>=0.17,<0.18",
  "docker>=7,<8",
]

[project.entry-points."omnigent.sandbox_providers"]
podman = "omnigent.community.sandbox.podman.plugin:get_contribution"

[tool.setuptools.packages.find]
where = ["src"]
include = ["omnigent.community.sandbox.podman*"]
namespaces = true
